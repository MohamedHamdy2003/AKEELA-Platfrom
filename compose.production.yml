# Template only. Requires server-side secrets and an actual domain before deployment.
services:
  admin:
    image: ${ADMIN_IMAGE:-akeela-admin:local}
    restart: unless-stopped
    networks: [edge]
  restaurant:
    image: ${RESTAURANT_IMAGE:-akeela-restaurant:local}
    restart: unless-stopped
    networks: [edge]
  delivery:
    image: ${DELIVERY_IMAGE:-akeela-delivery:local}
    restart: unless-stopped
    networks: [edge]
  api:
    image: ${API_IMAGE:-akeela-api:local}
    restart: unless-stopped
    init: true
    environment: &api-environment
      NODE_ENV: production
      PORT: '3000'
      TZ: Africa/Cairo
      PUBLIC_BASE_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}
      IMAGE_STORAGE_PATH: /app/storage/images
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with postgres as the database hostname}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DEFAULT_DELIVERY_COMPANY_ID: ${DEFAULT_DELIVERY_COMPANY_ID:-}
      TRUST_PROXY: 'true'
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      OTP_SECRET: ${OTP_SECRET:?Set OTP_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-akeela-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-akeela-clients}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      AUTH_REFRESH_TTL_SECONDS: ${AUTH_REFRESH_TTL_SECONDS:-2592000}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-600}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_RESEND_SECONDS: ${OTP_RESEND_SECONDS:-60}
      AUTH_RATE_WINDOW_SECONDS: ${AUTH_RATE_WINDOW_SECONDS:-900}
      AUTH_RATE_IP_LIMIT: ${AUTH_RATE_IP_LIMIT:-60}
      AUTH_RATE_ACCOUNT_LIMIT: ${AUTH_RATE_ACCOUNT_LIMIT:-10}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: 'true'
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM}
    volumes:
      - images:/app/storage/images
    networks: [edge, database]
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  init:
    image: ${API_IMAGE:-akeela-api:local}
    restart: 'no'
    init: true
    command:
      ['sh', '-c', 'npm run migration:run:prod && npm run create:admin:prod']
    environment:
      <<: *api-environment
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      ADMIN_VERIFIED: ${ADMIN_VERIFIED:-true}
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: akeela
      POSTGRES_DB: akeela
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U akeela -d akeela']
      interval: 5s
      timeout: 3s
      retries: 10
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN}
      VENDOR_DOMAIN: ${VENDOR_DOMAIN:?Set VENDOR_DOMAIN}
      DELIVERY_DOMAIN: ${DELIVERY_DOMAIN:?Set DELIVERY_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/routes.caddy:/etc/caddy/routes.caddy:ro
      - ./deploy/frontend-routes.caddy:/etc/caddy/frontend-routes.caddy:ro
      - images:/srv/images:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_healthy
      restaurant:
        condition: service_healthy
      delivery:
        condition: service_healthy
networks:
  edge:
  database:
    internal: true
volumes:
  postgres_data:
  images:
  caddy_data:
  caddy_config:
