server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https: http: blob:; connect-src 'self' https: ws://$http_host wss://$http_host; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location = /index.html { expires -1; }
    location /assets/ { expires 1y; }
    location / { try_files $uri $uri/ /index.html; }
}
