server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    if ($http_host !~* ^[a-z0-9.-]+(:[0-9]+)?$) { return 444; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https: blob:; connect-src 'self' https://api.akeelaonline.tech wss://api.akeelaonline.tech wss://$http_host; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location = /index.html { expires -1; }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https: blob:; connect-src 'self' https://api.akeelaonline.tech wss://api.akeelaonline.tech wss://$http_host; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
