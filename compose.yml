# Local PostgreSQL only; not a production deployment definition.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: akeela
      POSTGRES_PASSWORD: local_password
      POSTGRES_DB: akeela
    ports:
      - '127.0.0.1:${LOCAL_POSTGRES_PORT:-15432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U akeela -d akeela']
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:11025:1025'
      - '127.0.0.1:18025:8025'
volumes:
  postgres_data:
