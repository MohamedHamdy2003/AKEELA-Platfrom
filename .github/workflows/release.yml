name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
      admin: ${{ steps.admin-reference.outputs.image }}
      restaurant: ${{ steps.restaurant-reference.outputs.image }}
      delivery: ${{ steps.delivery-reference.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - id: reference
        env:
          NAME: ${{ steps.name.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=$NAME@$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: admin-build
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.name }}-admin:${{ github.sha }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - id: admin-reference
        env:
          NAME: ${{ steps.name.outputs.name }}-admin
          DIGEST: ${{ steps.admin-build.outputs.digest }}
        run: echo "image=$NAME@$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: restaurant-build
        with:
          context: .
          file: apps/restaurant/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.name }}-restaurant:${{ github.sha }}
          cache-from: type=gha,scope=restaurant
          cache-to: type=gha,mode=max,scope=restaurant
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - id: restaurant-reference
        env:
          NAME: ${{ steps.name.outputs.name }}-restaurant
          DIGEST: ${{ steps.restaurant-build.outputs.digest }}
        run: echo "image=$NAME@$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: delivery-build
        with:
          context: .
          file: apps/delivery/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.name }}-delivery:${{ github.sha }}
          cache-from: type=gha,scope=delivery
          cache-to: type=gha,mode=max,scope=delivery
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - id: delivery-reference
        env:
          NAME: ${{ steps.name.outputs.name }}-delivery
          DIGEST: ${{ steps.delivery-build.outputs.digest }}
        run: echo "image=$NAME@$DIGEST" >> "$GITHUB_OUTPUT"
  deploy:
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      HOST: ${{ vars.VPS_HOST }}
      DEPLOY_USER: ${{ vars.VPS_USER }}
      PORT: ${{ vars.VPS_PORT }}
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_IMAGE: ${{ needs.publish.outputs.image }}
      ADMIN_IMAGE: ${{ needs.publish.outputs.admin }}
      RESTAURANT_IMAGE: ${{ needs.publish.outputs.restaurant }}
      DELIVERY_IMAGE: ${{ needs.publish.outputs.delivery }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure pinned SSH connection
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HOST" =~ ^[a-zA-Z0-9.-]+$ && "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ && "$PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$RELEASE_IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          for image in "$ADMIN_IMAGE" "$RESTAURANT_IMAGE" "$DELIVERY_IMAGE"; do [[ "$image" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]; done
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          (umask 077 && printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts)
          printf 'Host *\n  IdentityFile ~/.ssh/id_ed25519\n  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 15\n' > ~/.ssh/config
      - name: Transfer release and deploy immutable image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REGISTRY_USER" =~ ^[a-zA-Z0-9-]+$ ]]
          remote="$DEPLOY_USER@$HOST"
          ssh -p "$PORT" "$remote" "mkdir -p /opt/akeela/releases/$RELEASE_SHA"
          tar -czf - compose.production.yml deploy/Caddyfile deploy/routes.caddy deploy/frontend-routes.caddy deploy/release.sh | ssh -p "$PORT" "$remote" "tar -xzf - -C /opt/akeela/releases/$RELEASE_SHA"
          printf '%s' "$REGISTRY_TOKEN" | ssh -p "$PORT" "$remote" "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"
          trap 'ssh -p "$PORT" "$remote" "docker logout ghcr.io" >/dev/null 2>&1 || true' EXIT
          ssh -p "$PORT" "$remote" "bash /opt/akeela/releases/$RELEASE_SHA/deploy/release.sh '$RELEASE_IMAGE' '$RELEASE_SHA' '$ADMIN_IMAGE' '$RESTAURANT_IMAGE' '$DELIVERY_IMAGE'"
