name: Restaurant frontend
on:
  pull_request:
    branches: [dev, main]
    paths:
      [
        'apps/restaurant/**',
        'packages/brand/**',
        'package*.json',
        'eslint.config.mjs',
        '.github/workflows/restaurant.yml',
      ]
  push:
    branches: [dev, main]
    paths:
      [
        'apps/restaurant/**',
        'packages/brand/**',
        'package*.json',
        'eslint.config.mjs',
        '.github/workflows/restaurant.yml',
      ]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:restaurant
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace @akeela/restaurant
      - run: docker build -f apps/restaurant/Dockerfile -t akeela-restaurant:check .
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-restaurant" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/restaurant/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: VITE_API_BASE_URL=${{ vars.RESTAURANT_API_BASE_URL || '/api/v1' }}
