name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_call:
    outputs:
      api_changed:
        description: Whether the API or shared build/deployment files changed
        value: ${{ jobs.verify.outputs.api_changed }}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      api_changed: ${{ steps.changes.outputs.api }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: akeela_ci_test
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d akeela_ci_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
      mailpit:
        image: axllent/mailpit:latest
        ports: ['11025:1025', '18025:8025']
    env:
      TEST_DATABASE_URL: postgresql://test:ci-only-password@localhost:15432/akeela_ci_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/changed-apps.mjs
      - run: npm run check:repo
      - if: steps.changes.outputs.api == 'true'
        run: npm run check:api
      - if: steps.changes.outputs.api == 'true'
        run: npm run test:integration
      - if: steps.changes.outputs.frontends == 'true'
        run: npm run check:restaurant && npm run check:admin && npm run check:delivery
      - if: steps.changes.outputs.frontends == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.changes.outputs.frontends == 'true'
        run: npm run test:e2e --workspace @akeela/restaurant && npm run test:e2e --workspace @akeela/admin && npm run test:e2e --workspace @akeela/delivery
      - run: npm run audit:runtime
      - run: bash -n deploy/bootstrap-vps.sh deploy/release.sh
      - if: steps.changes.outputs.frontends == 'true'
        run: npm run smoke:production
