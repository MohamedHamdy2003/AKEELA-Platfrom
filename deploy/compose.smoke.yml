# Isolated test deployment. Never use this file or these credentials in production.
services:
  admin:
    image: akeela-admin:smoke
  restaurant:
    image: akeela-restaurant:smoke
  delivery:
    image: akeela-delivery:smoke
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: smoke
      POSTGRES_PASSWORD: smoke-only-password
      POSTGRES_DB: akeela_smoke_test
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smoke -d akeela_smoke_test']
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    image: ${SMOKE_IMAGE:-akeela-api:smoke}
    environment: &api-environment
      NODE_ENV: production
      TZ: Africa/Cairo
      DATABASE_URL: postgresql://smoke:smoke-only-password@postgres:5432/akeela_smoke_test
      JWT_SECRET: smoke-only-jwt-key-012345678901234567890
      OTP_SECRET: smoke-only-otp-key-012345678901234567890
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_REQUIRE_TLS: 'true'
      SMTP_FROM: smoke@example.com
      PUBLIC_BASE_URL: https://localhost
      IMAGE_STORAGE_PATH: /app/storage/images
      TRUST_PROXY: 'true'
      CORS_ORIGINS: ${SMOKE_CORS_ORIGINS:-https://localhost}
      DEFAULT_DELIVERY_COMPANY_ID: '1'
    volumes: [images:/app/storage/images]
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
  init:
    image: ${SMOKE_IMAGE:-akeela-api:smoke}
    command:
      ['sh', '-c', 'npm run migration:run:prod && npm run create:admin:prod']
    environment:
      <<: *api-environment
      ADMIN_EMAIL: smoke@example.com
      ADMIN_PASSWORD: SmokeOnlyPassword123
      ADMIN_PHONE: '+201000000001'
      ADMIN_FULL_NAME: Smoke Admin
    depends_on:
      postgres:
        condition: service_healthy
  caddy:
    image: caddy:2
    environment:
      APP_DOMAIN: api.example.com
      ACME_EMAIL: smoke@example.com
      ADMIN_DOMAIN: admin.example.com
      VENDOR_DOMAIN: vendor.example.com
      DELIVERY_DOMAIN: delivery.example.com
    command: ['caddy', 'run', '--config', '/etc/caddy/Caddyfile']
    ports: ['127.0.0.1::443', '127.0.0.1::80']
    volumes:
      - ./Caddyfile.smoke:/etc/caddy/Caddyfile:ro
      - ./Caddyfile:/etc/caddy/Caddyfile.production:ro
      - ./routes.caddy:/etc/caddy/routes.caddy:ro
      - ./frontend-routes.caddy:/etc/caddy/frontend-routes.caddy:ro
      - images:/srv/images:ro
      - certificates:/data
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_healthy
      restaurant:
        condition: service_healthy
      delivery:
        condition: service_healthy
volumes:
  database:
  images:
  certificates:
